name: RaylibIOSExample
options:
  bundleIdPrefix: com.raylib
  deploymentTarget:
    iOS: "12.0"
  xcodeVersion: "14.0"

settings:
  base:
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CLANG_CXX_LIBRARY: libc++
    GCC_C_LANGUAGE_STANDARD: c11

targets:
  RaylibIOSExample:
    type: application
    platform: iOS
    sources:
      # Example files
      - path: AppDelegate.m
      - path: game.c
      # raylib source files - use rcore_objc.m wrapper to compile as Objective-C
      # (required because iOS platform layer uses UIKit/Objective-C)
      - path: ../../src/rcore_objc.m
      - path: ../../src/rshapes.c
      - path: ../../src/rtextures.c
      - path: ../../src/rtext.c
      - path: ../../src/rmodels.c
      - path: ../../src/raudio_objc.m
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.raylib.iosExample
        PRODUCT_NAME: RaylibIOSExample
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Preprocessor defines
        GCC_PREPROCESSOR_DEFINITIONS:
          - PLATFORM_IOS=1
          - GRAPHICS_API_OPENGL_ES3=1
          - SUPPORT_GESTURES_SYSTEM=1
          - $(inherited)
        # Header search paths - use both, compiler finds the right headers
        HEADER_SEARCH_PATHS:
          - $(PROJECT_DIR)/../../src
          - $(PROJECT_DIR)/frameworks/simulator/libEGL.framework/Headers
          - $(PROJECT_DIR)/frameworks/simulator/libGLESv2.framework/Headers
          - $(PROJECT_DIR)/frameworks/device/libEGL.framework/Headers
          - $(PROJECT_DIR)/frameworks/device/libGLESv2.framework/Headers
          - $(inherited)
        # Linker flags
        OTHER_LDFLAGS:
          - -ObjC
          - -framework libEGL
          - -framework libGLESv2
          - -framework UIKit
          - -framework QuartzCore
          - -framework Foundation
          - -framework Metal
          - -framework AVFoundation
          - -framework AudioToolbox
          - $(inherited)
        # Runtime search path
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/Frameworks"
      configs:
        Debug:
          # Simulator-specific settings
          FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]:
            - $(PROJECT_DIR)/frameworks/simulator
            - $(inherited)
          # Device-specific settings
          FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]:
            - $(PROJECT_DIR)/frameworks/device
            - $(inherited)
        Release:
          # Simulator-specific settings
          FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]:
            - $(PROJECT_DIR)/frameworks/simulator
            - $(inherited)
          # Device-specific settings
          FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]:
            - $(PROJECT_DIR)/frameworks/device
            - $(inherited)
    preBuildScripts:
      - name: "Copy ANGLE Frameworks"
        script: |
          # Select correct frameworks based on platform
          if [[ "$PLATFORM_NAME" == *"simulator"* ]]; then
            FRAMEWORK_DIR="$PROJECT_DIR/frameworks/simulator"
          else
            FRAMEWORK_DIR="$PROJECT_DIR/frameworks/device"
          fi

          # Create destination directory
          FRAMEWORK_DST="$BUILT_PRODUCTS_DIR/$FRAMEWORKS_FOLDER_PATH"
          mkdir -p "$FRAMEWORK_DST"

          # Copy frameworks (remove old ones first to avoid issues)
          rm -rf "$FRAMEWORK_DST/libEGL.framework"
          rm -rf "$FRAMEWORK_DST/libGLESv2.framework"
          cp -R "$FRAMEWORK_DIR/libEGL.framework" "$FRAMEWORK_DST/"
          cp -R "$FRAMEWORK_DIR/libGLESv2.framework" "$FRAMEWORK_DST/"

          echo "Copied ANGLE frameworks (libEGL, libGLESv2) for $PLATFORM_NAME"
        basedOnDependencyAnalysis: false
